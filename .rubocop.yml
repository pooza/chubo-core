# 正本は pooza/ginseng-style の config/rubocop.yml。ここには chubo-core 固有の差分だけを書く。
# ⚠ 共通に見える緩和をここに足さないこと。共通化したい場合は pooza/ginseng-style に Issue を立てる。
# ⚠ `bundle exec rubocop` で実行すること（inherit_gem は gem のパス解決に Bundler を使う）。
inherit_gem:
  ginseng-style: config/rubocop.yml

# ⚠⚠ inherit_mode が無いと、下の Exclude / Include は継承した配列を**置換する**
# （マージされない）。⚠ rubocop は緑のまま通るので気づけない。
# ⚠ Include は merge に入れない。merge にすると rubocop 既定の Include（Gemfile など）
#   まで戻ってきて、`**/Gemfile*` の除外と食い違う。**全部書く。**
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - '**/*.md'
    - '**/*.code-workspace'
    - '**/Gemfile*'
    - '**/cookbooks/**/*.erb'
    - LICENSE.txt
  # ⚠ cookbook の Ruby は拡張子を持たないものがあるので '**/*' で拾う。
  Include:
    - '**/*'
    - '**/Rakefile'
  TargetRubyVersion: 3.4
# ⚠ 正本は test/**/* を除外している。このリポジトリは test/ を持たず、代わりに
#   cookbook の Ruby が長くなるので、そちらを除外する。
Layout/LineLength:
  Exclude:
    - cookbooks/**/*.rb
# ⚠ 正本は test/**/* だけを除外している。cookbook では条件分岐で同じ設定を
#   書き下す形が読みやすいので、このリポジトリでは切る。
Style/IdenticalConditionalBranches:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false
